<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1976d2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h2 {
            margin: 0;
            font-size: 24px;
        }

        .card p {
            margin: 10px 0 0 0;
            font-size: 18px;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #1976d2;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .logout {
            float: right;
            background-color: #e53935;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

    </style>
</head>
<body>
<header>
    <h1>관리자 대시보드</h1>
    <button class="logout" onclick="logout()">로그아웃</button>
</header>

<div class="container">
    <div class="cards">
        <div class="card" onclick="location.href='/admin/members'" style="cursor:pointer;">
            <h2 id="member-count">0</h2>
            <p>총 회원 수</p>
        </div>
        <div class="card" onclick="location.href='/admin/studies'" style="cursor:pointer;">
            <h2 id="study-count">0</h2>
            <p>총 스터디 수</p>
        </div>
    </div>

    <h2>최근 회원 목록</h2>
    <table id="user-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>이메일</th>
            <th>가입일</th>
        </tr>
        </thead>
        <tbody>
        <!-- JS로 데이터 채워짐 -->
        </tbody>
    </table>

    <h2>최근 스터디 목록</h2>
    <table id="study-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>스터디 이름</th>
            <th>카테고리</th>
            <th>생성일</th>
        </tr>
        </thead>
        <tbody>
        <!-- JS로 데이터 채워짐 -->
        </tbody>
    </table>
</div>

<script>
    async function loadDashboard() {
        try {
            const response = await fetch('/api/admin', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                const error = await res.json();
                alert(error.message);
                return;
            }

            const dashboardData = await response.json();

            // 통계 수치 업데이트
            document.getElementById('member-count').textContent = dashboardData.memberCount;
            document.getElementById('study-count').textContent = dashboardData.studyCount;

            // 최근 가입 유저 테이블 업데이트
            const tbody = document.getElementById('user-table').querySelector('tbody');
            tbody.innerHTML = ''; // 기존 내용 초기화
            dashboardData.recentMembers.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.joined}</td>
                `;
                tbody.appendChild(tr);
            });

            // 최근 스터디 테이블 업데이트
            const studyTbody = document.getElementById('study-table').querySelector('tbody');
            studyTbody.innerHTML = '';
            dashboardData.recentStudies.forEach(study => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${study.id}</td>
                    <td>${study.name}</td>
                    <td>${study.category}</td>
                    <td>${study.created}</td>
                `;
                studyTbody.appendChild(tr);
            });

        } catch (error) {
            console.error(err);
            alert('대시보드 데이터를 불러오는데 실패했습니다.');
        }
    }

    // 페이지가 로드되면 호출
    window.addEventListener('DOMContentLoaded', loadDashboard);

    // 로그아웃 함수
    function logout() {
        // 예: JWT 쿠키 삭제 후 홈으로 이동
        fetch('/logout', { method: 'POST' })
            .then(() => {
                alert("로그아웃 처리");
                location.href = "/";
            });
    }
</script>
</body>
</html>
