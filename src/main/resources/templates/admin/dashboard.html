<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1976d2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h2 {
            margin: 0;
            font-size: 24px;
        }

        .card p {
            margin: 10px 0 0 0;
            font-size: 18px;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #1976d2;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .logout {
            float: right;
            background-color: #e53935;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

    </style>
</head>
<body>
<header>
    <h1>관리자 대시보드</h1>
    <button class="logout" onclick="logout()">로그아웃</button>
</header>

<div class="container">
    <div class="cards">
        <div class="card">
            <h2 id="user-count">0</h2>
            <p>총 회원 수</p>
        </div>
        <div class="card">
            <h2 id="study-count">0</h2>
            <p>총 스터디 수</p>
        </div>
        <div class="card">
            <h2 id="active-study-count">0</h2>
            <p>활성 스터디</p>
        </div>
    </div>

    <h2>최근 회원 목록</h2>
    <table id="user-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>이메일</th>
            <th>가입일</th>
        </tr>
        </thead>
        <tbody>
        <!-- JS로 데이터 채워짐 -->
        </tbody>
    </table>
</div>

<script>
    // 예시 데이터 (나중에 API fetch로 교체)
    const dashboardData = {
        userCount: 120,
        studyCount: 45,
        activeStudyCount: 30,
        recentUsers: [
            {id:1, name:"홍길동", email:"hong@test.com", joined:"2025-12-01"},
            {id:2, name:"김철수", email:"kim@test.com", joined:"2025-11-28"},
            {id:3, name:"이영희", email:"lee@test.com", joined:"2025-11-27"}
        ]
    };

    document.getElementById('user-count').textContent = dashboardData.userCount;
    document.getElementById('study-count').textContent = dashboardData.studyCount;
    document.getElementById('active-study-count').textContent = dashboardData.activeStudyCount;

    const tbody = document.getElementById('user-table').querySelector('tbody');
    dashboardData.recentUsers.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.joined}</td>
        `;
        tbody.appendChild(tr);
    });

    function logout() {
        alert("로그아웃 처리");
        location.href = "/";
    }
</script>
</body>
</html>
