<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전체 회원 목록</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f8; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; }
    th { background: #1976d2; color: white; }
    tr:hover { background: #f1f1f1; }

    /* 페이징 버튼 */
    .pagination {
      display: flex;
      gap: 6px;
      margin-top: 20px;
    }

    .pagination button {
      padding: 6px 12px;
      border: 1px solid #1976d2;
      background: white;
      color: #1976d2;
      border-radius: 4px;
      cursor: pointer;
    }

    .pagination button.active {
      background: #1976d2;
      color: white;
    }

    .pagination button:disabled {
      background: #ccc;
      cursor: not-allowed;
      color: #666;
    }
    td, th { text-align: center; }
  </style>
</head>
<body>

<h1>전체 회원 목록</h1>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>이름</th>
    <th>이메일</th>
    <th>가입일</th>
    <th>삭제 & 권한변경</th>
  </tr>
  </thead>
  <tbody id="member-table"></tbody>
</table>

<!-- 페이지네이션 UI -->
<div class="pagination" id="pagination"></div>

<script>
  let currentPage = 0;
  const size = 9;

  async function loadMembers(page = 0) {

    const url = `/api/admin/members?page=${page}&size=${size}`;

    try {
      const res = await fetch(url);

      if (!res.ok) {
          const error = await res.json();
          alert(error.message);
          return;
      }

      const data = await res.json();

      // content = 실제 회원 목록
      const members = data.content;

      const tbody = document.getElementById('member-table');
      tbody.innerHTML = '';

      members.forEach(m => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${m.id}</td>
          <td>${m.name}</td>
          <td>${m.email}</td>
          <td>${m.joined}</td>
          <td style="text-align:center;">
            <button class="delete-btn" data-id="${m.id}">삭제</button>
            <button class="role-btn" data-id="${m.id}" data-role="${m.role}">권한변경</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // 페이지네이션 만들기
      createPagination(data.totalPages, data.number);

    } catch (err) {
      console.error(err);
      alert("회원 목록을 불러오지 못했습니다.");
    }
  }

  function createPagination(totalPages, page) {
    const container = document.getElementById('pagination');
    container.innerHTML = '';

    currentPage = page;

    // 이전 버튼
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '이전';
    prevBtn.disabled = (page === 0);
    prevBtn.onclick = () => loadMembers(page - 1);
    container.appendChild(prevBtn);

    // 번호 버튼
    for (let i = 0; i < totalPages; i++) {
      const btn = document.createElement('button');
      btn.textContent = (i + 1);
      if (i === page) btn.classList.add('active');
      btn.onclick = () => loadMembers(i);
      container.appendChild(btn);
    }

    // 다음 버튼
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '다음';
    nextBtn.disabled = (page === totalPages - 1);
    nextBtn.onclick = () => loadMembers(page + 1);
    container.appendChild(nextBtn);
  }

  // === 여기서 tbody 이벤트 위임 등록 ===
  const tbody = document.getElementById('member-table');
  tbody.addEventListener('click', async (e) => {
    const memberId = e.target.dataset.id;

    // 삭제 버튼 클릭
    if (e.target.classList.contains('delete-btn')) {
      if (confirm("정말 삭제하시겠습니까?")) {
        try {
          const res = await fetch(`/api/admin/members/${memberId}`, { method: 'DELETE' });
          if (!res.ok) {
            const error = await res.json();
            alert(error.message);
            return;
          }
          alert('삭제 완료');
          loadMembers(currentPage);
        } catch (err) {
          console.error(err);
          alert('삭제 중 오류 발생');
        }
      }
    }

    // 권한 변경 버튼 클릭
    if (e.target.classList.contains('role-btn')) {
      const currentRole = e.target.dataset.role;
      const newRole = currentRole === 'USER' ? 'ADMIN' : 'USER';
      if (confirm(`${memberId} 사용자의 권한을 ${newRole}로 변경하시겠습니까?`)) {
        try {
          const res = await fetch(`/api/admin/members/${memberId}/role`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: newRole })
          });
          if (!res.ok) {
            const error = await res.json();
            alert(error.message);
            return;
          }
          alert('권한 변경 완료');
          loadMembers(currentPage);
        } catch (err) {
          console.error(err);
          alert('권한 변경 중 오류 발생');
        }
      }
    }
  });

  window.addEventListener('DOMContentLoaded', () => loadMembers(0));
</script>

</body>
</html>
