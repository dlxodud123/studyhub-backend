<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>스터디 상세</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f7f7f7; margin:0; padding:20px; }
    .container { max-width:800px; margin:0 auto; }
    .card { background:white; padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }

    h1 { margin-top:0; font-size:24px; }
    .meta { font-size:13px; color:#666; display:flex; gap:10px; margin-bottom:20px; }

    .content-box {
      white-space:pre-wrap;
      line-height:1.6;
      font-size:15px;
    }

    .btn-row { margin-top:20px; display:flex; gap:10px; }
    .btn { padding:8px 14px; border:none; border-radius:6px; cursor:pointer; }
    .primary { background:#4CAF50; color:white; }
    .danger { background:#e74c3c; color:white; }
    .secondary { background:#eee; color:#333; border:1px solid #ddd; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1 id="title">로딩중...</h1>
    <div class="meta">
      <div id="writer"></div>
      <div id="createdAt"></div>
      <div id="category"></div>
    </div>
    <div id="tags" style="margin:10px 0; display:flex; gap:6px; flex-wrap:wrap;"></div>

    <div id="content" class="content-box"></div>

    <!-- 댓글 입력 -->
    <div id="comment-section" style="margin-top:40px;">
      <h2 style="font-size:18px;">댓글</h2>

      <div style="display:flex; gap:10px; margin:10px 0;">
        <input id="commentInput"
               type="text"
               placeholder="댓글을 입력하세요"
               style="flex:1; padding:10px; border:1px solid #ccc; border-radius:6px;">
        <button id="commentSubmitBtn"
                class="btn primary"
                style="padding:10px 16px;">등록</button>
      </div>

      <!-- 댓글 목록 -->
      <div id="commentList" style="margin-top:20px;"></div>
    </div>

    <div class="btn-row">
      <button class="btn secondary" id="backBtn">뒤로가기</button>
      <button class="btn primary" id="editBtn">수정하기</button>
      <button class="btn danger" id="deleteBtn">삭제하기</button>
    </div>
  </div>
</div>

<script>
  const studyId = window.location.pathname.split('/').pop();

  document.getElementById('backBtn').addEventListener('click', () => {
    window.history.back();
  });

  document.getElementById('editBtn').addEventListener('click', () => {
    window.location.href = `/study/edit/${studyId}`;
  });

  document.getElementById('deleteBtn').addEventListener('click', async () => {
    if (!confirm("정말 삭제하시겠습니까?")) return;

    try {
      const res = await fetch(`/api/studies/delete/${studyId}`, {
        method: 'DELETE',
        credentials: 'include',
        headers: {
          "X-Requested-With": "XMLHttpRequest"
        }
      });

      if (res.status === 401) {
          window.location.href = "/login";
          return;
      }

      if (res.status === 403) {
          const err = await res.json();
          alert(err.message);
          return;
      }

      if (!res.ok) {
          const error = await res.json();
          alert(error.message);
          window.location.href = `/studies/${studyId}`;
          return;
      }

      alert("삭제되었습니다.");
      window.location.href = "/study/list";

    } catch (err) {
      console.error(err);
      alert("스터디 삭제를 실패했습니다.");
    }
  });

  async function fetchDetail() {
    try {
      const res = await fetch(`/api/studies/detail/${studyId}`);

      if (!res.ok) {
          const error = await res.json();
          alert(error.message);
          return;
      }

      const data = await res.json();

      renderDetail(data);

    } catch (err) {
      console.error(err);
      alert('스터디 내용 불러오는 중 오류가 발생했습니다.');
    }
  }

  function renderDetail(data) {
    document.getElementById('title').innerText = escapeHtml(data.title);
    document.getElementById('writer').innerText = "작성자: " + (escapeHtml(data.createdBy || "익명"));
    document.getElementById('createdAt').innerText = "작성일: " + (data.createdAt || "");
    document.getElementById('category').innerText = "카테고리: " + (escapeHtml(data.categoryName || "-"));

    // 태그 표시
    const tagsDiv = document.getElementById('tags');
    tagsDiv.innerHTML = (data.tagNames || [])
            .map(t => `<span class="tag" style="background:#eef;padding:4px 8px;border-radius:999px;font-size:12px;color:#225;">${escapeHtml(t)}</span>`)
            .join('');

    // content는 태그 허용할지에 따라 다름 → 여기서는 태그 허용하지 않음 (보안)
    document.getElementById('content').innerText = data.content || "";
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  // 댓글 등록
  document.getElementById('commentSubmitBtn').addEventListener('click', async () => {
    const content = document.getElementById('commentInput').value.trim();

    if (!content) return alert("댓글을 입력해주세요.");

    try {
      const res = await fetch(`/api/studies/create/comments/${studyId}`, {
        method: 'POST',
        credentials: 'include',
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content })
      });

      if (!res.ok) {
          const error = await res.json();
          alert(error.message);
          return;
      }

      alert("댓글 등록 성공!");

      document.getElementById('commentInput').value = "";
      loadComments();

    } catch (e) {
      console.error(e);
      alert('댓글 등록을 실패했습니다.');
    }
  });

  // 댓글 목록 불러오기
  async function loadComments() {
    try {
      const res = await fetch(`/api/studies/comments/${studyId}`);

      if (!res.ok) {
          const error = await res.json();
          alert(error.message);
          return;
      }

      const list = await res.json();

      renderComments(list);

    } catch (e) {
      console.error(e);
      alert('댓글 내용 불러오는 중 오류가 발생했습니다.');
    }
  }

  // 댓글 렌더링
  function renderComments(comments) {

    const div = document.getElementById('commentList');

    if (!comments.length) {
      div.innerHTML = `
        <div style="
          text-align:center;
          color:#888;
          font-size:14px;
          padding:20px;
          background:#f9f9f9;
          border-radius:6px;
        ">
          <span style="margin-right:6px;">💬</span>댓글이 없습니다.
        </div>
      `;
      return;
    }

    div.innerHTML = comments.map(c => `
      <div style="background:#fff; padding:12px; border-radius:8px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.05);">
        <div style="font-size:14px; font-weight:bold;">${escapeHtml(c.createdBy ?? "익명")}</div>
        <div style="font-size:14px; margin:6px 0;">${escapeHtml(c.content)}</div>
        <div style="font-size:12px; color:#888;">${c.createdAt}</div>

        ${c.isMine ? `
          <button onclick="deleteComment(${c.commentId})" class="btn danger" style="margin-top:8px; padding:4px 10px; font-size:12px;">삭제</button>
        ` : ""}
      </div>
    `).join('');
  }

  fetchDetail();
  loadComments();
</script>
</body>
</html>
