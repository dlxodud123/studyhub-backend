<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스터디 수정</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 16px;
      margin-right: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>스터디 수정</h2>

<label>제목</label>
<input type="text" id="title">

<label>작성자</label>
<input type="text" id="createdBy" readonly>

<label>내용</label>
<textarea id="content" rows="10"></textarea>

<button id="saveBtn">저장</button>
<button id="cancelBtn">취소</button>

<script>
  const studyId = window.location.pathname.split('/').pop();

  // 상세 데이터 불러오기
  async function loadDetail() {
    try {
      const res = await fetch(`/api/studies/edit/${studyId}`, {
        credentials: 'include'
      });

      if (!res.ok) {
          const error = await res.json();
          alert(error.message);
          window.location.href = `/studies/${studyId}`;
          return;
      }

      const data = await res.json();

      // 기존 값을 input에 채워넣기
      document.getElementById('title').value = data.title;
      document.getElementById('createdBy').value = data.createdBy;
      document.getElementById('content').value = data.content;

    } catch (e) {
      console.error(e);
      alert('수정 페이지를 불러오는데 실패했습니다.');
      window.location.href = `/studies/${studyId}`;
    }
  }

  // 저장 버튼 클릭
  document.getElementById('saveBtn').addEventListener('click', async () => {

    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();

    if (!title) return alert("제목을 입력해주세요.");
    if (!content) return alert("내용을 입력해주세요.");

    const requestBody = {
      title: document.getElementById('title').value,
      content: document.getElementById('content').value
    };

    try {
      const res = await fetch(`/api/studies/edit/${studyId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'include',
        body: JSON.stringify(requestBody)
      });

      if (!res.ok) {
          const error = await res.json();
          alert(error.message);
          window.location.href = `/studies/${studyId}`;
          return;
      }

      alert('수정이 완료되었습니다.');
      window.location.href = `/studies/${studyId}`;

    } catch (e) {
      console.error(e);
      alert('수정을 실패했습니다.');
      window.location.href = `/studies/${studyId}`;
    }
  });

  // 취소 → 상세페이지로 이동
  document.getElementById('cancelBtn').addEventListener('click', () => {
    window.location.href = `/studies/${studyId}`;
  });

  loadDetail();
</script>

</body>
</html>
