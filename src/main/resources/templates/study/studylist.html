<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>스터디 목록</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f7f7f7; margin:0; padding:20px; }
        .container { max-width:1000px; margin:0 auto; }
        header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        h1 { margin:0; font-size:24px; }
        .btn { padding:8px 12px; border-radius:6px; background:#4CAF50; color:#fff; cursor:pointer; border:none; }
        .grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
        .card { background:#fff; border-radius:8px; padding:16px; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
        .card h3 { margin:0 0 8px 0; font-size:18px; }
        .meta { font-size:12px; color:#666; margin-bottom:12px; display:flex; gap:8px; flex-wrap:wrap; }
        .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
        .tag { background:#eef; padding:4px 8px; border-radius:999px; font-size:12px; color:#225; }
        .pager { display:flex; justify-content:center; gap:8px; margin-top:18px; }
        .page-btn { padding:6px 10px; border-radius:6px; background:#eee; border:none; cursor:pointer; }
        .page-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .empty { text-align:center; color:#777; padding:40px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>스터디 목록</h1>
        <div>
            <button class="btn" id="createBtn">새 스터디 작성</button>
        </div>
    </header>

    <div id="searchBox" style="margin-bottom: 20px; display:flex; gap:10px; align-items:center;">
        <select id="searchType" class="page-btn" style="padding:6px 8px;">
            <option value="title">제목</option>
            <option value="content">내용</option>
            <option value="createdBy">작성자</option>
            <option value="tag">태그</option>
        </select>

        <input type="text" id="searchKeyword" placeholder="검색어 입력" style="padding:6px 8px; width:200px;">

        <select id="categoryFilter" class="page-btn" style="padding:6px 8px;">
            <option value="">전체 카테고리</option>
            <option value="1">프로그래밍</option>
            <option value="2">영어스터디</option>
            <option value="3">면접스터디</option>
        </select>

        <button class="btn" id="searchBtn">검색</button>
    </div>

    <section id="listSection">
        <div id="grid" class="grid"></div>
        <div id="empty" class="empty" style="display:none;">게시글이 없습니다.</div>
        <div class="pager" id="pager"></div>
    </section>
</div>

<script>
    // 페이징을 위한 변수
    let page = 0;
    const size = 9;

    document.getElementById('createBtn').addEventListener('click', () => {
      window.location.href = '/study/create'; // 작성 페이지로 이동
    });

    async function fetchStudies(p = 0) {

      const searchType = document.getElementById("searchType").value;
      const keyword = document.getElementById("searchKeyword").value;
      const categoryId = document.getElementById("categoryFilter").value;

      const query = new URLSearchParams({
        page: p,
        size: size,
        searchType: searchType,
        keyword: keyword,
        categoryId: categoryId
      });

      try {
        const res = await fetch(`/api/studies?` + query.toString());

        if (!res.ok) {
            const error = await res.json();
            alert(error.message);
            return;
        }

        const data = await res.json();

        renderList(data);

      } catch (err) {
        console.error(err);
        alert('스터디 리스트를 불러오는데 실패했습니다.');
      }
    }

    function renderList(data) {
      // 두 가지 응답 포맷을 유연하게 처리
      const content = Array.isArray(data) ? data : (data.content || []);
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      if (content.length === 0) {
        document.getElementById('empty').style.display = 'block';
        document.getElementById('pager').innerHTML = '';
        return;
      } else {
        document.getElementById('empty').style.display = 'none';
      }

      content.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3 data-id="${item.id}">${escapeHtml(item.title)}</h3>
          <div class="meta">
            <div>작성자: ${escapeHtml(item.createdBy || '익명')}</div>
            <div>카테고리: ${escapeHtml(item.categoryName  || '-')}</div>
            <div>댓글: ${item.commentCount ?? 0}</div>
          </div>
          <div>${truncate(stripHtml(item.content || ''), 150)}</div>
          <div class="tags">${(item.tagNames || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        `;

        // 제목 또는 카드 클릭 시 상세로 이동
        card.addEventListener('click', (e) => {
          const id = item.id;
          if (id) window.location.href = `/studies/${id}`; // 상세 페이지가 있다면 연결
        });

        grid.appendChild(card);
      });

      // 페이징 UI
      const pager = document.getElementById('pager');
      pager.innerHTML = '';
      if (!Array.isArray(data) && typeof data.totalPages === 'number') {
        const totalPages = data.totalPages;
        const current = data.number ?? page;
        // 이전 버튼
        const prev = document.createElement('button');
        prev.className = 'page-btn';
        prev.textContent = '‹ 이전';
        prev.disabled = current <= 0;
        prev.addEventListener('click', () => { page = current - 1; fetchStudies(page); });
        pager.appendChild(prev);
        // 페이지 숫자 버튼
        for (let i = 0; i < totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = 'page-btn';
            pageBtn.textContent = i + 1; // 화면에는 1부터 보이게
            if (i === current) {
                pageBtn.style.background = '#4CAF50';
                pageBtn.style.color = '#fff';
            }
            pageBtn.addEventListener('click', () => {
                page = i;
                fetchStudies(page);
            });
            pager.appendChild(pageBtn);
        }
        // 다음 버튼
        const next = document.createElement('button');
        next.className = 'page-btn';
        next.textContent = '다음 ›';
        next.disabled = current >= totalPages - 1;
        next.addEventListener('click', () => { page = current + 1; fetchStudies(page); });
        pager.appendChild(next);
      }
    }

    // XSS공격 방지
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    }
    // <p>, .... 태그 같은 것들을 안보여주고 적용
    function stripHtml(str) {
      return (str || '').replace(/<[^>]*>/g, '');
    }
    // 글자가 너무 길면 n자까지만 잘라서 "..." 붙여주는 함수
    function truncate(str, n) {
      return str.length > n ? escapeHtml(str.slice(0,n)) + '...' : escapeHtml(str);
    }

    // 검색 버튼 클릭 이벤트 추가
    document.getElementById("searchBtn").addEventListener("click", () => {
      page = 0;
      fetchStudies(page);
    });

    fetchStudies(page);
</script>
</body>
</html>
