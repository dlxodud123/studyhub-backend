<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>스터디 작성</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f7f7f7; margin:0; padding:20px; }
    .container { max-width:700px; margin:0 auto; }
    h1 { font-size:22px; margin-bottom:12px; }
    .card { background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
    input, textarea, select { width:100%; box-sizing:border-box; padding:10px; margin-bottom:12px; border:1px solid #ddd; border-radius:6px; }
    textarea { min-height:200px; resize:vertical; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; }
    .btn { padding:10px 14px; border:none; border-radius:6px; background:#4CAF50; color:#fff; cursor:pointer; }
    .secondary { background:#eee; color:#333; border:1px solid #ddd; }
    .help { font-size:12px; color:#666; margin-bottom:12px; }
  </style>
</head>
<body>
<div class="container">
  <h1>스터디 작성</h1>
  <div class="card">
    <label>제목</label>
    <input id="title" placeholder="제목을 입력하세요" />

    <label>카테고리</label>
    <select id="categoryId">
      <option value="">카테고리 선택</option>
      <option value="1">프로그래밍</option>
      <option value="2">영어스터디</option>
      <option value="3">면접스터디</option>
    </select>

    <label>태그 (쉼표로 구분)</label>
    <input id="tags" placeholder="예: Java, Spring, React" />

    <label>내용</label>
    <textarea id="content" placeholder="내용을 입력하세요"></textarea>

    <div class="row">
      <button class="btn" id="submitBtn">작성하기</button>
      <button class="btn secondary" id="cancelBtn" type="button">취소</button>
    </div>

    <div class="help">작성 후에는 목록으로 이동합니다. 로그인한 사용자만 작성 가능합니다.</div>
  </div>
</div>

<script>
  document.getElementById('cancelBtn').addEventListener('click', () => {
    window.history.back();
  });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const categoryId = document.getElementById('categoryId').value;
    const tagsRaw = document.getElementById('tags').value.trim();

    if (!title) { alert('제목을 입력해주세요.'); return; }
    if (!content) { alert('내용을 입력해주세세요.'); return; }
    if (!categoryId) { alert('카테고리를 입력해주세세요.'); return; }

    const tagIds = [];
    const tagNames = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

    // 전송할 body (서버 요구사항에 맞춰 조정)
    const body = {
      title,
      content,
      categoryId: Number(categoryId),
      tagNames
    };

    try {
      const res = await fetch('/api/studies/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        credentials: 'include'
      });

      if (!res.ok) {
          const error = await res.json();
          alert(error.message);
          return;
      }

      alert('작성 완료!');
      window.location.href = `/study/list`;

    } catch (err) {
      console.error(err);
      alert('스터디 생성 중 오류가 발생했습니다.');
    }
  });
</script>
</body>
</html>
