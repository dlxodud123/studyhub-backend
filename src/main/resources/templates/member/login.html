<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 페이지</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 320px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .sub-buttons {
            display: flex;
            gap: 5px; /* 버튼 사이 간격 */
            margin-top: 10px;
            width: 100%; /* 부모 컨테이너 전체 폭 사용 */
        }
        .sub-buttons button {
            flex: 1; /* 3개 버튼 균등 분할 */
            padding: 8px;
            font-size: 0.9em;
            background-color: #eee;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }
        .sub-buttons button:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>로그인</h2>
    <input id="username" type="text" name="username" placeholder="아이디" required>
    <input id="password" type="password" name="password" placeholder="비밀번호" required>
    <input id="email" type="email" name="email" placeholder="이메일" required>
    <button id="loginBtn" type="button">로그인</button>
    <div class="sub-buttons">
        <button type="button" onclick="location.href='/find-username'">유저네임 찾기</button>
        <button type="button" onclick="location.href='/find-password'">비밀번호 찾기</button>
        <button type="button" onclick="location.href='/find-email'">이메일 찾기</button>
    </div>
    <script>
        document.getElementById("loginBtn").addEventListener("click", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const email = document.getElementById("email").value;

            // 필수 입력값 체크
            if (!username) {
                alert("아이디를 입력해주세요.");
                return;
            }
            if (!password) {
                alert("비밀번호를 입력해주세요.");
                return;
            }
            if (!email) {
                alert("이메일을 입력해주세요.");
                return;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("올바른 이메일 형식이 아닙니다.");
                return;
            }

            try {
                const res = await fetch("/api/members/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password, email })
                });

                if (!res.ok) {
                    const error = await res.json();
                    alert(error.message);
                    return;
                }

                alert("로그인 성공!");
                window.location.href = "/";

            } catch (err) {
                console.error(err);
                alert("로그인 중 오류가 발생했습니다.");
            }
        });
    </script>
</div>
</body>
</html>
