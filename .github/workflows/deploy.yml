name: Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. JDK 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 3. 빌드 (테스트 제외)
      - name: Build project
        run: ./gradlew build -x test

      # 4. JAR를 EC2로 복사
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/studyhub-backend-0.0.1-SNAPSHOT.jar"
          target: "~/app/build/libs/"

      # 5. EC2에서 서버 재시작 
      - name: Restart server on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          # 타임아웃 충분히 늘리기
          command_timeout: 10m
          script: |
            cd ~/app
            # 기존 서버 종료
            pkill -f studyhub-backend-0.0.1-SNAPSHOT.jar || true
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            # 새 서버 실행
            nohup java -jar build/libs/studyhub-backend-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &